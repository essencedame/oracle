      "Nombre maître, le 11 amplifie le 2 : la réceptivité devient inspiration. Il demande à être ancré pour ne pas devenir tension.",
  },
  {
    n: "22",
    facette: "Bâtir",
    ...OR,
    maitre: true,
    message:
      "Ton projet n'est pas trop grand : il est à ta mesure. Ce qui semble immense vu d'en bas se construit comme tout le reste — une pierre, puis une autre.",
    question: "Quel grand rêve mérite enfin un premier plan concret ?",
    action: "Découpe-le en trois étapes. Mets la première dans ton agenda cette semaine.",
    equilibre: "La vision sans étape écrase. L'ampleur devient légère dès qu'elle a une date.",
    mantra: "Je transforme ma vision en étapes.",
    numero:
      "Nombre maître, le 22 amplifie le 4 : la structure se met au service d'une vision large. Il demande du réel, pas de la pression.",
  },
  {
    n: "33",
    facette: "Transmission",
    ...OR,
    maitre: true,
    message:
      "Ta présence fait plus que tu ne le penses. Et l'amour véritable inclut celle qui le donne : on ne transmet durablement que depuis un cœur nourri.",
    question: "Comment puis-je aider sans m'oublier ?",
    action: "Un geste d'attention pour quelqu'un — et un geste de même taille pour toi.",
    equilibre:
      "Se donner sans limite ne rend service à personne, surtout pas à ceux qu'on aime.",
    mantra: "Je donne depuis le plein, pas depuis le vide.",
    numero:
      "Nombre maître, le 33 amplifie le 6 : l'amour devient transmission. Il invite à servir sans se sacrifier.",
  },
];

const shuffle = (a) => {
  const r = [...a];
  for (let i = r.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
};

/* ---------- Logo (fleur de vie) ---------- */
const CHAKRAS = [[-22, "#6a2c91"], [-14.7, "#1e4d8c"], [-7.3, "#4a9dd4"], [0, "#4f9a45"], [7.3, "#f4d03f"], [14.7, "#e0921f"], [22, "#c0392b"]];
const Logo = ({ size = 40, stroke = 0.55, color = INK, opacity = 1 }) => (
  <svg width={size} height={size} viewBox="-25 -25 50 50" fill="none" aria-hidden="true" style={{ opacity }}>
    <g stroke={color} strokeWidth={stroke}>
      <circle cx="0" cy="0" r="22" />
      <circle cx="0" cy="0" r="11" />
      {[90, 150, 210, 270, 330, 30].map((a) => (
        <circle key={a} cx={11 * Math.cos((a * Math.PI) / 180)} cy={-11 * Math.sin((a * Math.PI) / 180)} r="11" />
      ))}
    </g>
    {CHAKRAS.map(([y, c]) => <circle key={y} cx="0" cy={y} r="1.7" fill={c} />)}
  </svg>
);

const Star = ({ size = 14 }) => (
  <svg className="or-star" width={size} height={size} viewBox="-10 -10 20 20" aria-hidden="true">
    <path d="M0,-10 Q0,0 10,0 Q0,0 0,10 Q0,0 -10,0 Q0,0 0,-10 Z" fill="currentColor" />
  </svg>
);

/* ---------- Mode aperçu ----------
   true : les cartes du 1 et du 2 sont toujours dans l'éventail et repérables au dos.
   Mettre false pour revenir au tirage normal (dos tous identiques). */
const APERCU = true;
const EN_APERCU = (c) => APERCU && (c.n === "1" || c.n === "2");

const LOGO_VERT = "#3f6b5f";

const Svg = ({ html, className }) => <div className={className} dangerouslySetInnerHTML={{ __html: html }} />;

const CSS = `
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&family=Young+Serif&display=swap');

.or-root {
  --ink: ${INK};
  --ink-2: #57524c;
  --creme: ${CREME};
  --sauge: ${SAUGE};
  --turquoise: ${TURQUOISE};
  --tint: #f6f1e7;
  --pastel: #d9d9d9;
  --deep: #5f6166;

  --cw: 100px;
  --ch: 171px;
  --radius: 900px;

  --ui: 'DM Sans', -apple-system, system-ui, sans-serif;
  --disp: 'Young Serif', Georgia, serif;

  box-sizing: border-box;
  min-height: 100vh;
  font-family: var(--ui);
  color: var(--ink);
  background: var(--tint);
  transition: background 0.9s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: calc(40px + env(safe-area-inset-top, 0px)) 0 calc(56px + env(safe-area-inset-bottom, 0px));
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
.or-root *, .or-root *::before, .or-root *::after { box-sizing: border-box; }

/* ---------- accueil ---------- */
.or-start { display: flex; flex-direction: column; align-items: center; gap: 30px; padding: 0 24px; text-align: center; }
.or-logo-idle {
  width: 132px; height: 132px; border-radius: 50%;
  background: var(--creme); border: 1.2px solid var(--ink);
  display: flex; align-items: center; justify-content: center;
}
.or-intro { font-size: 17px; line-height: 1.5; color: var(--ink-2); max-width: 28ch; margin: 0; }
.or-btn {
  font-family: var(--ui); font-size: 15px; font-weight: 500;
  color: var(--creme); background: var(--ink);
  border: 0; border-radius: 999px; padding: 15px 32px; min-height: 48px;
  cursor: pointer; transition: transform 0.2s ease;
}
.or-btn:hover { transform: translateY(-2px); }
.or-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

/* ---------- dos (style d'origine) ---------- */
.or-dos {
  position: relative;
  background: #ffffff;
  border: 0;
  border-radius: 12px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 1px 0 rgba(31, 33, 36, 0.06), 0 8px 22px rgba(31, 33, 36, 0.11);
}
.or-dos::after {
  content: '';
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(31, 33, 36, 0.08);
  border-radius: 7px;
  pointer-events: none;
}

/* ---------- étalement ---------- */
.or-spread-wrap { display: flex; flex-direction: column; align-items: center; gap: 26px; width: 100%; }
.or-spread { position: relative; width: 100%; height: calc(var(--ch) + 140px); }
.or-back {
  position: absolute; left: 50%; bottom: 20px;
  width: var(--cw); height: var(--ch); margin-left: calc(var(--cw) / -2);
  transform-origin: 50% var(--radius);
  cursor: pointer;
  transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  animation: or-deal 0.7s cubic-bezier(0.22, 1, 0.36, 1) backwards;
}
@keyframes or-deal { from { transform: rotate(0deg) translateY(60px) scale(0.88); opacity: 0; } }
.or-back:hover, .or-back:focus-visible { transform: rotate(var(--rot)) translateY(-26px) scale(1.06) !important; z-index: 60; }
.or-back:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.or-tag {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between;
  padding: 7px 6px 8px;
  border: 5px solid var(--tag); border-radius: inherit;
  pointer-events: none;
}
.or-tag-n {
  font-family: var(--disp); font-size: 22px; line-height: 1; color: var(--ink);
  background: var(--tag); border: 1.4px solid var(--ink); border-radius: 999px;
  min-width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
}
.or-tag-f {
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--ui); font-size: 11px; font-weight: 500; color: var(--ink);
  background: var(--tag); border: 1.2px solid var(--ink); border-radius: 999px; padding: 2px 7px;
}
.or-hint { font-family: var(--disp); font-size: 17px; color: var(--ink-2); }

/* ---------- retournement ---------- */
.or-flip { width: min(360px, calc(100% - 40px)); perspective: 1800px; }
.or-flipper { position: relative; transform-style: preserve-3d; animation: or-turn 1.05s cubic-bezier(0.45, 0, 0.2, 1) 0.1s backwards; }
@keyframes or-turn { from { transform: rotateY(180deg) scale(0.94); } to { transform: rotateY(0deg) scale(1); } }
.or-flipper > .or-dos {
  position: absolute; inset: 0; border-radius: 18px;
  transform: rotateY(180deg); backface-visibility: hidden; -webkit-backface-visibility: hidden;
}
.or-flipper > .or-dos::after { inset: 10px; border-radius: 11px; }

/* ---------- face ---------- */
.or-face {
  position: relative;
  aspect-ratio: 265 / 454;
  background: var(--pastel);
  border: 2px solid var(--ink);
  border-radius: 18px;
  padding: 11px;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  box-shadow: 0 18px 50px rgba(43, 38, 34, 0.16);
  color: var(--ink);
  font-family: var(--disp);
}
.or-frame { height: 100%; display: flex; flex-direction: column; gap: 9px; }
.or-head, .or-art, .or-foot { border: 1.8px solid var(--ink); border-radius: 10px; background: var(--creme); }
.or-head { height: 13%; min-height: 58px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
.or-num { font-size: 52px; line-height: 1; }
.or-num.small { font-size: 42px; }
.or-art { flex: 1; min-height: 0; overflow: hidden; }
.or-art > div { width: 100%; height: 100%; }
.or-foot { height: 11%; min-height: 50px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 13px; }
.or-facette { margin: 0; font-family: var(--disp); font-weight: 400; font-size: 21px; line-height: 1; letter-spacing: 0.06em; text-transform: uppercase; }
.or-star { display: block; flex-shrink: 0; }
.or-star path { fill: var(--creme); stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; }

/* ---------- message ---------- */
.or-sheet {
  width: min(480px, calc(100% - 40px)); margin-top: 26px;
  background: var(--creme); border: 2px solid var(--ink); border-radius: 18px;
  padding: 26px 24px 4px; text-align: center;
  animation: or-fade 0.6s ease 1s backwards;
}
.or-sheet-top { display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--ink); font-family: var(--disp); font-size: 15px; margin-bottom: 14px; }
.or-sheet-elem { font-family: var(--ui); font-size: 13px; font-weight: 500; color: var(--ink); background: var(--pastel); border: 1.6px solid var(--ink); border-radius: 999px; padding: 3px 11px; }
.or-msg { margin: 0 auto; font-family: var(--disp); font-size: 21px; line-height: 1.45; max-width: 26ch; text-wrap: pretty; color: var(--ink); }
.or-mantra { margin: 16px auto 20px; font-size: 16px; font-style: italic; line-height: 1.45; color: var(--deep); text-wrap: balance; }
.or-more { text-align: left; border-top: 1.8px solid var(--ink); }

/* ---------- pour aller plus loin ---------- */
@keyframes or-fade { from { opacity: 0; } }
.or-toggle {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  background: transparent; border: 0; padding: 14px 0; min-height: 48px; cursor: pointer;
  font-family: var(--ui); font-size: 15px; font-weight: 500; color: var(--ink);
}
.or-toggle:focus-visible { outline: 2px solid var(--deep); outline-offset: 2px; border-radius: 8px; }
.or-chev { transition: transform 0.35s ease; }
.or-chev.open { transform: rotate(180deg); }
.or-panel { max-height: 0; overflow: hidden; transition: max-height 0.55s cubic-bezier(0.22, 1, 0.36, 1); }
.or-panel.open { max-height: 1600px; }
.or-row { padding: 16px 0; border-top: 1px solid rgba(47, 43, 40, 0.18); }
.or-panel-inner { padding-bottom: 8px; }
.or-row-label { display: inline-block; font-size: 13px; font-weight: 500; color: var(--ink); background: var(--pastel); border: 1.4px solid var(--ink); border-radius: 999px; padding: 2px 10px; margin-bottom: 8px; }
.or-row-text { font-size: 15.5px; line-height: 1.6; color: var(--ink-2); }
.or-row-text.or-em { font-family: var(--disp); font-size: 18px; line-height: 1.45; color: var(--ink); }

.or-again {
  margin-top: 24px; font-family: var(--ui); font-size: 14px; font-weight: 500; color: var(--ink);
  background: var(--creme); border: 1.8px solid var(--ink); border-radius: 999px;
  padding: 13px 26px; min-height: 48px; cursor: pointer;
  animation: or-fade 0.6s ease 1.1s backwards;
}
.or-again:hover { background: var(--pastel); }
.or-again:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

@media (max-width: 860px) { .or-root { --cw: 82px; --ch: 140px; --radius: 620px; } }
@media (max-width: 560px) {
  .or-root { --cw: 60px; --ch: 103px; --radius: 400px; }
  .or-back.or-dos { border-radius: 9px; }
  .or-back.or-dos::after { inset: 4px; border-radius: 6px; }
  .or-tag { border-width: 3px; padding: 4px 3px 5px; }
  .or-tag-n { font-size: 15px; min-width: 24px; height: 24px; }
  .or-tag-f { font-size: 8px; padding: 1px 4px; }
  .or-face { padding: 9px; }
  .or-frame { gap: 7px; }
  .or-num { font-size: 44px; }
  .or-facette { font-size: 18px; }
  .or-msg { font-size: 19px; }
}
@media (prefers-reduced-motion: reduce) {
  .or-root *, .or-root { animation: none !important; transition: none !important; }
}
`;

function Oracle() {
  const [phase, setPhase] = useState("idle"); // idle | spread | card
  const [deck, setDeck] = useState([]);
  const [card, setCard] = useState(null);
  const [open, setOpen] = useState(false);
  const [w, setW] = useState(typeof window !== "undefined" ? window.innerWidth : 1024);

  useEffect(() => {
    const onResize = () => setW(window.innerWidth);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  const fanCount = Math.min(FAN_MAX, w < 560 ? 13 : w < 860 ? 17 : FAN_MAX, CARDS.length);
  const fanDeg = w < 560 ? 62 : w < 860 ? 58 : 54;

  const spread = () => {
    if (APERCU) {
      const vues = CARDS.filter(EN_APERCU);
      const autres = shuffle(CARDS.filter((c) => !EN_APERCU(c))).slice(0, Math.max(0, fanCount - vues.length));
      setDeck(shuffle([...vues, ...autres]));
    } else {
      setDeck(shuffle(CARDS).slice(0, fanCount));
    }
    setCard(null);
    setOpen(false);
    setPhase("spread");
    window.scrollTo({ top: 0 });
  };
  const choose = (c) => { setCard(c); setOpen(false); setPhase("card"); };

  const p = card ? PAL[card.n] : null;
  const style = p ? { "--pastel": p.P, "--deep": p.D, "--tint": p.L } : undefined;
  const elem = card && ELEM[card.n];

  return (
    <div className="or-root" style={style}>
      <style>{CSS}</style>

      {phase === "idle" && (
        <div className="or-start">
          <div className="or-logo-idle"><Logo size={96} /></div>
          <p className="or-intro">Pose ta question, respire, puis laisse une carte venir à toi.</p>
          <button className="or-btn" onClick={spread}>Tirer une carte</button>
        </div>
      )}

      {phase === "spread" && (
        <div className="or-spread-wrap">
          <div className="or-spread" role="group" aria-label={`${deck.length} cartes face cachée`}>
            {deck.map((c, i) => {
              const t = deck.length > 1 ? i / (deck.length - 1) - 0.5 : 0;
              const rot = t * fanDeg;
              return (
                <button
                  key={`${c.n}-${c.facette}`}
                  className="or-back or-dos"
                  style={{ "--rot": `${rot}deg`, transform: `rotate(${rot}deg)`, zIndex: i, animationDelay: `${i * 0.035}s` }}
                  onClick={() => choose(c)}
                  aria-label={EN_APERCU(c) ? `Carte ${c.n}, ${c.facette}` : `Choisir la carte ${i + 1} sur ${deck.length}`}
                >
                  <Logo size={w < 560 ? 26 : 34} stroke={0.5} opacity={0.9} color={LOGO_VERT} />
                  {EN_APERCU(c) && (
                    <span className="or-tag" style={{ "--tag": PAL[c.n].P }} aria-hidden="true">
                      <span className="or-tag-n">{c.n}</span>
                      <span className="or-tag-f">{c.facette}</span>
                    </span>
                  )}
                </button>
              );
            })}
          </div>
          <div className="or-hint">Choisis la carte qui t'appelle</div>
        </div>
      )}

      {phase === "card" && card && (
        <>
          <div className="or-flip" key={`${card.n}-${card.facette}`}>
            <div className="or-flipper">
              <article className="or-face" aria-label={`Carte ${card.n}, ${card.facette}`}>
                <div className="or-frame">
                  <div className="or-head"><Star /><div className={`or-num${card.n.length > 1 ? " small" : ""}`}>{card.n}</div><Star /></div>
                  <div className="or-art"><Svg html={MOTIFS[`${card.n}|${card.facette}`] || ""} /></div>
                  <div className="or-foot"><Star size={12} /><h1 className="or-facette">{card.facette}</h1><Star size={12} /></div>
                </div>
              </article>
              <div className="or-dos" aria-hidden="true"><Logo size={110} stroke={0.45} color={LOGO_VERT} /></div>
            </div>
          </div>

          <section className="or-sheet">
            <div className="or-sheet-top">
              <Star size={10} />
              <span className="or-sheet-elem">{elem || "Nombre maître"}</span>
              <Star size={10} />
            </div>
            <p className="or-msg">{card.message}</p>
            <p className="or-mantra">{card.mantra}</p>
            <div className="or-more">
              <button className="or-toggle" onClick={() => setOpen((o) => !o)} aria-expanded={open}>
                <span>Pour aller plus loin</span>
                <svg className={`or-chev${open ? " open" : ""}`} width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                  <path d="M3 5l4 4 4-4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" />
                </svg>
              </button>
              <div className={`or-panel${open ? " open" : ""}`}>
                <div className="or-row">
                  <div className="or-row-label">Question d'introspection</div>
                  <div className="or-row-text or-em">{card.question}</div>
                </div>
                <div className="or-row">
                  <div className="or-row-label">Une action</div>
                  <div className="or-row-text">{card.action}</div>
                </div>
                <div className="or-row">
                  <div className="or-row-label">Le rôle de cette énergie</div>
                  <div className="or-row-text">{card.equilibre}</div>
                </div>
                <div className="or-row">
                  <div className="or-row-label">Le rôle du nombre {card.n}</div>
                  <div className="or-row-text">{card.numero}</div>
                </div>
              </div>
            </div>
          </section>

          <button className="or-again" onClick={spread}>Tirer une autre carte</button>
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Oracle />);
</script>
</body>
</html>
